name: .NET

on:
  push:
    branches: [ "master", "fix-*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: pre-build.ps1
      run: powershell -ExecutionPolicy Unrestricted ./pre-build.ps1
      shell: pwsh
    - name: build.ps1
      run: powershell -ExecutionPolicy Unrestricted ./build.ps1
      shell: pwsh

    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v1.1.3
    - name: msbuild panacea
      run: |
        msbuild OpenKh.Research.Panacea\OpenKh.Research.Panacea.vcxproj /p:Configuration=Release /p:Platform=x64
        xcopy "OpenKh.Research.Panacea\Release\*.dll" bin\
        xcopy "OpenKh.Research.Panacea\Dependencies\*.dll" bin\

    - name: Organize release for mod users
      run: powershell -ExecutionPolicy Unrestricted ./.github/scripts/prepare-release.ps1
      shell: pwsh

    - name: Build Linux and Steam Deck release
      run: powershell -ExecutionPolicy Unrestricted ./.github/scripts/prepare-linux-release.ps1
      shell: pwsh

    - name: create openkh-release
      shell: bash
      env:
        RELEASE_TAG: "release2-${{github.run_number}}"
      run: |
        echo $RELEASE_TAG > openkh/openkh-release
        echo $RELEASE_TAG > openkh-linux-x64/openkh-release

    - name: Create Windows release archive
      run: powershell -ExecutionPolicy Unrestricted ./.github/scripts/create-release-archive.ps1 -SourceDirectory openkh -DestinationPath openkh.zip
      shell: pwsh

    - name: Create Linux and Steam Deck release archive
      run: powershell -ExecutionPolicy Unrestricted ./.github/scripts/create-release-archive.ps1 -SourceDirectory openkh-linux-x64 -DestinationPath openkh-linux-x64.zip
      shell: pwsh

    - name: validate update archive
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "openkh.zip"))
        try {
          $archiveEntries = @($archive.Entries | ForEach-Object { $_.FullName })
        }
        finally {
          $archive.Dispose()
        }
        $requiredEntries = @(
          "openkh/OpenKh.Launcher.exe",
          "openkh/OpenKh.Tools.ModsManager.exe",
          "openkh/Apps/OpenKh.Tools.ModsManager.exe"
        )
        foreach ($entry in $requiredEntries) {
          if ($entry -notin $archiveEntries) {
            throw "Required update entry '$entry' is missing from openkh.zip."
          }
        }
        $obsoleteEntries = @(
          "openkh/AdvancedTools",
          "openkh/Apps/ModManager"
        )
        foreach ($entry in $obsoleteEntries) {
          if ($archiveEntries | Where-Object { $_.StartsWith($entry, [System.StringComparison]::OrdinalIgnoreCase) }) {
            throw "Obsolete update entry '$entry' is present in openkh.zip."
          }
        }

        $linuxArchive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "openkh-linux-x64.zip"))
        try {
          $linuxArchiveEntries = @($linuxArchive.Entries | ForEach-Object { $_.FullName })
        }
        finally {
          $linuxArchive.Dispose()
        }
        $linuxRequiredEntries = @(
          "openkh-linux-x64/OpenKh.Launcher",
          "openkh-linux-x64/Apps/OpenKh.Tools.ModsManager",
          "openkh-linux-x64/install-openkh-linux.sh"
        )
        foreach ($entry in $linuxRequiredEntries) {
          if ($entry -notin $linuxArchiveEntries) {
            throw "Required Linux update entry '$entry' is missing from openkh-linux-x64.zip."
          }
        }
        $invalidLinuxEntry = $linuxArchiveEntries | Where-Object { $_.Contains('\') } | Select-Object -First 1
        if ($invalidLinuxEntry) {
          throw "Linux archive entry '$invalidLinuxEntry' contains a Windows path separator."
        }

    - name: "GitHub release latest"
      if: ${{ github.ref_name == 'master' }}
      uses: "marvinpinto/action-automatic-releases@latest"
      continue-on-error: true # at non master branch this will always fail
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "latest"
        prerelease: false
        title: "OpenKh Latest Build"
        files: |
          openkh.zip
          openkh-linux-x64.zip

    - name: "GitHub release numbered"
      uses: "marvinpinto/action-automatic-releases@latest"
      continue-on-error: true # at non master branch this will always fail
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "release2-${{github.run_number}}"
        prerelease: false
        title: "OpenKh Build ${{github.run_number}} (${{github.ref_name}})"
        files: |
          openkh.zip
          openkh-linux-x64.zip
